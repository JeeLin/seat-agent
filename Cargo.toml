[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/tools",
    "crates/memory",
    "crates/server",
    "examples/basic_chat",
    "examples/voice_chat",
]

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/JeeLin/seat-agent.git"

[workspace.dependencies]
# 内部 crate
seat-agent-core = { path = "crates/core" }
seat-agent-tools = { path = "crates/tools" }
seat-agent-memory = { path = "crates/memory" }

# 异步运行时
tokio = { version = "1", features = ["full"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 错误处理
# YAML
serde_yaml = "0.9"
thiserror = "1"
anyhow = "1"

# HTTP 客户端
reqwest = { version = "0.11", default-features = false, features = ["json", "stream", "default-tls", "multipart"] }

# 异步 trait
async-trait = "0.1"

# 流
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }

# gRPC
tonic = "0.8"
prost = "0.11"
# 日志订阅者
tracing-subscriber = "0.3"
tonic-build = "0.8"

# Redis
redis = { version = "0.23", features = ["tokio-comp", "connection-manager"] }
# 音频采集与播放
cpal = "0.15"
rodio = "0.19"

# 日志
tracing = "0.1"

# 时间
chrono = { version = "0.4", features = ["serde"] }

# 正则
regex = "1"

