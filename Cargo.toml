[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/tools",
    "crates/memory",
    "crates/server",
    "examples/basic_chat",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/JeeLin/seat-agent.git"

[workspace.dependencies]
# 内部 crate
seat-agent-core = { path = "crates/core" }
seat-agent-tools = { path = "crates/tools" }
seat-agent-memory = { path = "crates/memory" }

# 异步运行时
tokio = { version = "1", features = ["full"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 错误处理
thiserror = "1"
anyhow = "1"
# HTTP 客户端
reqwest = { version = "0.11", default-features = false, features = ["json", "stream", "rustls-tls"] }

# 异步 trait
async-trait = "0.1"

# 流
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }

# 日志
tracing = "0.1"

# 时间
chrono = { version = "0.4", features = ["serde"] }

# 正则
regex = "1"
